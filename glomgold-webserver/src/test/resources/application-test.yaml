micronaut:
  server:
    port: -1

# The database is the Postgres container started by PostgresTestContainer; both the R2DBC
# datasource and the JDBC datasource Liquibase uses point at it, so tests run the real migrations.
r2dbc:
  datasources:
    default:
      dialect: POSTGRES
      url: r2dbc:tc:postgresql:///glomgold?TC_IMAGE_TAG=12
      driverClassName: org.testcontainers.jdbc.ContainerDatabaseDriver

datasources:
  liquibase:
    driverClassName: org.postgresql.Driver

logger:
  levels:
#    io.micronaut.http.client: TRACE
#    io.micronaut.data.query: TRACE
