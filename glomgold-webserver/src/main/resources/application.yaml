micronaut:
  application:
    name: glomgold
  server:
    port: ${PORT:8080}
  router:
    static-resources:
      default:
        enabled: true
        mapping: "/**"
        paths: "classpath:public"
  security:
    authentication: cookie
    basic-auth:
      www-authenticate: false
    redirect:
      # JSON API: return 200 + Set-Cookie on login instead of a 303 redirect.
      enabled: false
    endpoints:
      login:
        path: /api/login
        enabled: true
      logout:
        path: /api/logout
        enabled: true
        get-allowed: false
    token:
      bearer:
        enabled: false
      cookie:
        enabled: true
        cookie-name: glomgold-auth
        cookie-path: /
        cookie-http-only: true
        cookie-secure: ${COOKIE_SECURE:true}
        cookie-same-site: Strict
      generator:
        access-token:
          expiration: ${JWT_EXPIRATION_SECONDS:900}
      jwt:
        signatures:
          secret:
            generator:
              secret: '"${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}"'
    intercept-url-map:
      - pattern: /api/auth/**
        access: isAuthenticated()
      - pattern: /api/panel/**
        access: isAuthenticated()
      - pattern: /api/users/**
        access:
          - ROLE_ADMIN
      - pattern: /api/accounts/**
        access:
          - ROLE_ADMIN
      - pattern: /api/items/**
        access:
          - ROLE_ADMIN
      - pattern: /api/management/health
        access: isAnonymous()
      - pattern: /api/management/**
        access:
          - ROLE_ADMIN
      - pattern: /api/login
        access: isAnonymous()
      - pattern: /api/logout
        access: isAnonymous()
      - pattern: /**
        access: isAnonymous()

jackson:
  serializationInclusion: NON_NULL
  serialization:
    writeDatesAsTimestamps: false
  deserialization:
    useBigDecimalForFloats: true

endpoints:
  all:
    path: "/api/management"
    enabled: true
    sensitive: true

netty:
  default:
    allocator:
      max-order: 3

liquibase:
  enabled: true
  datasources:
    liquibase:
      change-log: classpath:db/liquibase-changelog.xml

glomgold:
  random:
    seed: 42
  security:
    # Response headers added by SecurityHeadersFilter; defaults mirror the Kotlin properties.
    headers:
      enabled: true
      x-frame-options: DENY
      x-content-type-options: nosniff
      referrer-policy: strict-origin-when-cross-origin
      permissions-policy: "geolocation=(), microphone=(), camera=()"
      strict-transport-security: "max-age=31536000; includeSubDomains"
      content-security-policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"