micronaut:
  application:
    name: glomgold-dev
  views:
    thymeleaf:
      cacheable: false
  security:
    token:
      cookie:
        # Dev runs over plain HTTP (vite proxy -> :8080), so the auth cookie
        # must not be Secure or the browser will drop it.
        cookie-secure: false

liquibase:
  enabled: true

r2dbc:
  datasources:
    default:
      schema-generate: NONE
      dialect: POSTGRES
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      url: "r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:glomgold}"

datasources:
  liquibase:
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:glomgold}"
    maximumPoolSize: 1

logger:
  levels:
    io.micronaut.data.query: TRACE